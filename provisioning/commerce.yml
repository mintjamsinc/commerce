namespaces:
  # JCR namespace for every commerce metadata property (commerce:status,
  # commerce:source_status, commerce:event_id, commerce:event_topic, ...).
  # Registered here so the prefix is available at first boot, BEFORE any commerce
  # content is deployed onto it. A one-time migration rewrites legacy
  # (pre-namespace) properties onto this prefix once it is registered.
  - prefix: commerce
    uri: http://www.mintjams.jp/commerce/1.0
roles: []
groups:
  - { id: commerce-operators, displayName: Commerce Operators }
  # The group whose ACL grants the commerce service user its write access. It is
  # an ordinary group; the service user below is a member of it.
  - { id: commerce-service-group, displayName: Commerce Service }
users:
  # The non-interactive identity the commerce integration runs as (EIP routes /
  # BPMN service tasks via runAs). 'service: true' marks it as a service account:
  # it has no password and can never sign in, but it is a regular principal that
  # is subject to ACLs - which is why it must be a member of
  # 'commerce-service-group' (granted write below).
  - id: commerce-service-user
    service: true
    displayName: Commerce Service
    memberOf: [commerce-service-group]
nodes:
  # --- Commerce platform ACLs -------------------------------------------------
  # Repository-wide READ is already granted to 'everyone' on / above and is
  # inherited here, so these nodes only need to ADD write. They are created at
  # first boot (before the commerce content is deployed), and the deployed
  # content underneath inherits these grants.
  #
  # Why grants are required: the commerce integration runs CMS work as
  # 'commerce-service-user' (EIP routes / BPMN service tasks via runAs). That run
  # identity is a regular principal - NOT a ServicePrincipal - so it is subject
  # to ACLs like any other principal. It is a member of
  # 'commerce-service-group' (both provisioned above), which is what these
  # entries grant. The built-in 'admin' user bypasses ACLs via the
  # administrator role and needs no entry. 'commerce-operators' is the group for
  # delegating commerce administration to non-admin operators (the admin
  # endpoints now run as the logged-in operator); create the group and add
  # operators to it via the Identity Manager app.

  # Business data written by the service user (event log, orders, inventory,
  # products, CRM, reconciliation, tasks, health, ...) and by operators
  # (PIM/pages edits, outbound-sync audit, on-demand recompute/reconcile).
  - path: /content/commerce
    primaryType: nt:folder
    acl:
      - group: commerce-service-group
        privileges: jcr:write
        effect: allow
      - group: commerce-operators
        privileges: jcr:write
        effect: allow

  # Public commerce assets under /content/public/commerce (anonymous READ via the
  # security.filters publicAccess rule below): the embed SDK and the sanitized
  # catalog read endpoint, which reads the admin product mirror directly with the
  # caller's session (everyone has /content READ).
  # No runtime process publishes here any more (the projection publisher was retired);
  # the service group keeps write so the storefront-retire migration can delete
  # the old /content/public/commerce/catalog projection.
  - path: /content/public/commerce
    primaryType: nt:folder
    acl:
      - group: commerce-service-group
        privileges: jcr:write
        effect: allow
      - group: commerce-operators
        privileges: jcr:write
        effect: allow

  # Commerce configuration. The *.yml here are read-only config (covered by the
  # repository-wide 'everyone' read). The service user additionally needs write
  # to persist the cached Shopify Admin API access token
  # (/etc/commerce/config/access_token). Operators stay read-only; their
  # best-effort token caching simply no-ops.
  - path: /etc/commerce/config
    primaryType: nt:folder
    acl:
      - group: commerce-service-group
        privileges: jcr:write
        effect: allow

  # Task-lock resources (see docs/clustering.md): every guarded script takes a
  # session-scoped JCR lock on /var/locks/<task name>. jcr:lockManagement is
  # already granted to everyone repository-wide by the workspace template, so
  # the writers only need jcr:write to create the per-task lock folders on
  # first use. Operators get it too because the manual admin triggers run the
  # same guarded scripts.
  - path: /var/locks
    primaryType: nt:folder
    acl:
      - group: commerce-service-group
        privileges: jcr:write
        effect: allow
      - group: commerce-operators
        privileges: jcr:write
        effect: allow
