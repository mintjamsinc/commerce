# Headless storefront (category F: #20 storefront, #21 realtime inventory)
# Deploy to: /etc/commerce/config/storefront.yml
# Managed by the Commerce app (Webtop > Commerce).
#
# The publisher builds a sanitized public catalog projection under
# /content/public/commerce/catalog/ that the ichigo.js storefront reads. Checkout
# redirects to Shopify's hosted checkout via a cart permalink, so no Storefront API
# token or secret is needed (the shop domain is taken from shopify.yml). See
# docs/storefront.md.

# Master switch for catalog publishing.
enabled: true

# Store presentation.
storeName: "Our Store"

# Fallback display currency (when a product carries none). Prices themselves come
# from the product data.
currency: "JPY"

# "Low stock" threshold: at/below this available quantity the storefront shows a
# "only a few left" badge; 0 shows "sold out".
lowStock: 5
