# Shopify configuration
# Deploy to: /etc/commerce/config/shopify.yml
# Managed by the Commerce app (Webtop > Commerce > Shop).

# Webhook shared secret — OPTIONAL. Incoming webhooks are verified by HMAC-SHA256.
# The app self-registers its webhook subscriptions via the Admin API, and those are
# signed with the APP'S CLIENT SECRET (adminApi.clientSecret below) — so they verify
# automatically with no value here. Set this ONLY to also verify webhooks created by
# hand in the Shopify admin (Settings > Notifications > Webhooks), which are signed
# with that page's shop secret. Leave blank when all webhooks are app-registered.
webhookSecret: ""

# Admin API integration (REQUIRED).
# The commerce integration uses the Shopify Admin API (GraphQL) to enrich products with
# metafields, reconcile the catalog mirror (status / price) and audit inventory via bulk
# operations, and write completed Fulfill Order tasks back as fulfillments. There is no
# on/off toggle: the Admin API is
# active as soon as the four connection fields below are filled in. Until then, those
# features are skipped with a warning ("Admin API not configured").
#
# All four connection fields are REQUIRED. Fill them in before going live.
adminApi:
  # Shop domain, e.g. your-store.myshopify.com
  shopDomain: ""
  # API version, e.g. 2026-01
  apiVersion: ""
  # OAuth credentials (from Shopify Partners > App > Client credentials)
  clientID: ""
  clientSecret: ""
  # When writing a fulfillment back to Shopify, whether to have Shopify email the
  # customer a shipping notification. Off by default to avoid surprise/duplicate
  # emails when the store already notifies on fulfillment. Set true to opt in.
  notifyCustomer: false
