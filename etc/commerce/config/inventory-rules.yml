# Inventory threshold rules
# Deploy to: /etc/commerce/config/inventory-rules.yml
#
# Dynamic alert thresholds for the inventory workflow. Instead of requiring a
# manual threshold on every product, the engine resolves an EFFECTIVE threshold
# per variant. Precedence, highest first:
#
#   1. manual override  — an explicit per-variant threshold an operator set on the
#                         product (via the "Set Inventory Threshold" form). Always wins.
#   2. rule             — the FIRST matching rule below (evaluated top-down; put the
#                         most specific rules first).
#   3. default          — the value below, when set.
#   4. none             — no threshold; the variant is not monitored.
#
# Deploying this file with a `default` means products start being monitored
# immediately (no manual setup step). Without this file, behaviour is unchanged:
# only products with a manual threshold are monitored.
#
# A rule matches when ALL the criteria it declares hold (a rule with no `match`
# is a catch-all). Criteria:
#   productType        : list — Shopify product_type is one of these
#   vendor             : list — Shopify vendor is one of these
#   tags               : list — the product has at least one of these tags
#   season             : { from: "MM-DD", to: "MM-DD" } — today is within the window
#                        (may wrap the year end, e.g. from 11-15 to 01-15)
#   minVelocityPerDay  : number — the variant's sales velocity (units/day) is at
#                        least this (requires the sales-velocity feature; until
#                        then a velocity criterion simply never matches)

# Effective threshold when no rule matches. Remove to leave unmatched variants
# unmonitored (manual-only).
default: 5

rules:
  # Perishable goods: keep a high safety stock.
  - name: "Perishable"
    match:
      productType: ["Food", "Beverage"]
    threshold: 20

  # Seasonal / gift items get a higher threshold during the year-end peak.
  - name: "Year-end peak"
    match:
      tags: ["seasonal", "gift"]
      season:
        from: "11-15"
        to: "12-31"
    threshold: 30

  # Fast movers: react earlier when something is selling quickly.
  - name: "High velocity"
    match:
      minVelocityPerDay: 5
    threshold: 25

  # Clearance lines can run low without alerting.
  - name: "Clearance"
    match:
      tags: ["clearance"]
    threshold: 1
