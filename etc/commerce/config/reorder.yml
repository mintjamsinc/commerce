# Auto-reorder / replenishment
# Deploy to: /etc/commerce/config/reorder.yml
# Managed by the Commerce app (Webtop > Commerce > Replenishment).
#
# A periodic batch proposes purchase orders for variants whose stock will not
# cover the lead time + target cover at the current sales velocity. Each proposal
# starts a replenishment workflow: an operator reviews/adjusts the quantity and
# approves or rejects it; on approval the purchase order is recorded and sent to
# the supplier.
#
# Suggested quantity:
#   need = velocity * (leadTimeDays + targetCoverDays) - currentStock
#   qty  = roundUp( max(ceil(need), minOrderQty), roundTo )   (0 → no proposal)

# Master switch (false = no reorder proposals are created).
enabled: false

# Replenishment horizon and order shaping.
leadTimeDays: 7          # supplier lead time
targetCoverDays: 14      # days of stock to hold beyond the lead time
minOrderQty: 1           # never propose fewer than this (when qty > 0)
roundTo: 1               # round the order up to a multiple of this (case/pack size)

# Where an APPROVED purchase order is sent. The email transport (SMTP server,
# credentials, from) is reused from notifications.yml's `email` block; only the
# supplier recipient / webhook target are configured here.
#   delivery : none | email | webhook
#     none    → record the PO only (order manually); status stays "approved"
#     email   → email the PO to `email` via the notifications.yml SMTP transport
#     webhook → POST the PO JSON to `webhookUrl`
supplier:
  delivery: "none"
  email: "supplier@example.com"
  webhookUrl: "REPLACE_WITH_SUPPLIER_WEBHOOK_URL"
