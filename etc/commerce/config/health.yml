# Integration health monitor
# Deploy to: /etc/commerce/config/health.yml
# Managed by the Commerce app (Webtop > Commerce > Health).
#
# Metrics are ALWAYS recorded (webhook receipts / HMAC failures, route
# processing success/error + latency, Admin API success/error + latency) under
# /content/commerce/health/metrics/. This file only governs ALERTING: alerts
# are sent through the enabled notification channels (the same
# Slack/Discord/Teams/LINE/webhook/email plumbing).
#
# A rule is ON unless enabled is false. Each leaf is a scalar.

# Master switch for alerting (set false to record metrics without alerting).
enabled: true

# Failed HMAC verification (wrong/rotated webhook secret, or an unauthorized
# caller). A single failure alerts; repeats are suppressed for cooldownMinutes.
hmacFailures:
  enabled: false
  cooldownMinutes: 30

# Shopify Admin API errors. Every error is notified individually with its
# error detail.
apiErrors:
  enabled: false

# Webhook processing errors (routes moving payloads to the error folder).
# Every error is notified individually with its error detail.
routeErrors:
  enabled: false
