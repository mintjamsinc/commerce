<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="commerce import">
<defs>
  <clipPath id="clip-cimp"><rect x="0" y="0" width="180" height="180" rx="42" ry="42"></rect></clipPath>
  <linearGradient id="hl-cimp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.25"></stop>
    <stop offset="55%" stop-color="white" stop-opacity="0"></stop>
  </linearGradient>
  <linearGradient id="bg-cimp" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#60a5fa"></stop>
    <stop offset="100%" stop-color="#4338ca"></stop>
  </linearGradient>
</defs>
<rect x="0" y="0" width="180" height="180" rx="42" ry="42" fill="url(#bg-cimp)"></rect>
<g clip-path="url(#clip-cimp)">
  <!-- inbound (download) arrow -->
  <g fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="90" y1="44" x2="90" y2="100"></line>
    <path d="M 66 82 L 90 106 L 114 82"></path>
  </g>
  <!-- receiving tray -->
  <path d="M 50 116 L 50 132 L 130 132 L 130 116" fill="none" stroke="white"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
</g>
<g clip-path="url(#clip-cimp)">
  <rect x="0" y="0" width="180" height="180" fill="url(#hl-cimp)"></rect>
  <rect x="0.5" y="0.5" width="179" height="179" rx="41.5" ry="41.5" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="1"></rect>
</g>
</svg>
