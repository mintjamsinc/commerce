# The Shopify → CMS import console: trigger the historical Bulk backfill
# (orders / customers / products / inventory) and watch its progress. An orders
# backfill is the whole historical sales import — refunds are fetched for the
# refund-bearing orders and the sales-fact seed chains automatically on
# completion (its drain progress shows here too). Drift detection / mirror
# refresh lives in the
# separate Commerce Reconcile app so each console stays single-concern.
# Everything here is operator-triggered and idempotent. Self-contained
# (ichigo.js runtime only).
actions:
  open:
    icon: open
    label: Open
