title: Commerce Reconcile
icon: assets/icons/icon.svg
isAdminOnly: true
# The Shopify → CMS reconciliation console: detect drift between the
# mirrored CMS catalog and Shopify, refresh the CMS mirror from Shopify (Shopify
# is the single source of truth), and trigger an on-demand reconciliation pass.
# Read-mostly — the only write is "Run now" (refresh-only; nothing is written to
# Shopify). Split out of commerce-import so import and reconcile
# each stay single-concern. Self-contained (ichigo.js runtime only).
actions:
  open:
    icon: open
    label: Open
minimumWidth: 760
minimumHeight: 520
customWindowControls: true
singleton: true
