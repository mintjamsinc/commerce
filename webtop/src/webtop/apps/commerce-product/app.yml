identifier: 3f8b2c17-9d54-4e6a-b1c8-72e0a4d5f9b3
title: Commerce Product
icon: assets/icons/icon.svg
isAdminOnly: true
# The "product 360" editor: everything about one product in one place — Shopify
# base + publish state, price/stock editing (writes go to Shopify via the Admin
# API; the CMS mirror follows via webhooks), multi-language content, metafields
# (+ push), and per-variant planning values with adoption of proposed values.
# Registers as the editor for the product mirror's dedicated MIME type, so
# double-clicking a product node in the Content Browser (or the Commerce Products
# browser) opens it here.
editor: true
contentTypes:
  - application/vnd.mintjams.commerce.product+json
actions:
  open:
    icon: open
    label: Open
minimumWidth: 640
minimumHeight: 480
customWindowControls: true
