<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="commerce reports">
<defs>
  <clipPath id="clip-creports"><rect x="0" y="0" width="180" height="180" rx="42" ry="42"></rect></clipPath>
  <linearGradient id="hl-creports" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.25"></stop>
    <stop offset="55%" stop-color="white" stop-opacity="0"></stop>
  </linearGradient>
  <linearGradient id="bg-creports" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22d3ee"></stop>
    <stop offset="100%" stop-color="#0e7490"></stop>
  </linearGradient>
</defs>
<rect x="0" y="0" width="180" height="180" rx="42" ry="42" fill="url(#bg-creports)"></rect>
<g clip-path="url(#clip-creports)">
  <!-- report sheet -->
  <rect x="50" y="38" width="80" height="104" rx="10" fill="white" opacity="0.95"></rect>
  <!-- header lines -->
  <rect x="62" y="52" width="42" height="7" rx="3.5" fill="#0e7490" opacity="0.55"></rect>
  <rect x="62" y="66" width="30" height="6" rx="3" fill="#0e7490" opacity="0.3"></rect>
  <!-- chart bars -->
  <rect x="63" y="112" width="12" height="18" rx="3" fill="#0e7490"></rect>
  <rect x="83" y="100" width="12" height="30" rx="3" fill="#0e7490"></rect>
  <rect x="103" y="88" width="12" height="42" rx="3" fill="#0e7490"></rect>
  <!-- trend line over the bars -->
  <path d="M 69 106 L 89 94 L 109 82" fill="none" stroke="#22d3ee" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"></path>
  <circle cx="109" cy="82" r="5" fill="#22d3ee"></circle>
  <rect x="0" y="0" width="180" height="180" fill="url(#hl-creports)"></rect>
  <rect x="0.5" y="0.5" width="179" height="179" rx="41.5" ry="41.5" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="1"></rect>
</g>
</svg>
