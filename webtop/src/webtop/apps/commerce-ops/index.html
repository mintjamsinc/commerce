<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Commerce Operations</title>

	<!-- Bootstrap Icons (bundled with webtop) -->
	<link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- App CSS + shared Webtop design system -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
</head>

<body>
	<div id="app" v-cloak class="d-flex flex-column" @mounted="onMounted" @unmount="onUnmount">

		<!-- Top toolbar -->
		<nav class="nav-bar window-drag-region">
			<div class="toolbar-group">
				<button class="btn-icon" @click="refresh" :disabled="busy" :title="t('app.commerce-ops.toolbar.refresh')">
					<i class="bi bi-arrow-clockwise" :class="{ spin: busy }"></i>
				</button>
			</div>

			<!-- Section switcher -->
			<div class="toolbar-group">
				<button class="btn-icon section-toggle" :class="{ active: section === 'sync' }"
					@click="selectSection('sync')" :title="t('app.commerce-ops.section.sync')">
					<i class="bi bi-cloud-upload"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{ active: section === 'reconcile' }"
					@click="selectSection('reconcile')" :title="t('app.commerce-ops.section.reconcile')">
					<i class="bi bi-arrow-left-right"></i>
				</button>
				<button class="btn-icon section-toggle" :class="{ active: section === 'events' }"
					@click="selectSection('events')" :title="t('app.commerce-ops.section.events')">
					<i class="bi bi-collection"></i>
				</button>
			</div>

			<span class="nav-spacer"></span>

			<!-- Window controls -->
			<div class="window-controls">
				<button class="btn-icon" @click="onMinimizeWindow" :title="t('common.minimize')"><i class="bi bi-dash-lg"></i></button>
				<button class="btn-icon" @click="onToggleMaximizeWindow" :title="t('common.maximize')"><i class="bi bi-square"></i></button>
				<button class="btn-icon window-control-close" @click="onCloseWindow" :title="t('common.close')"><i class="bi bi-x-lg"></i></button>
			</div>
		</nav>

		<!-- Content -->
		<div class="content-body">
			<main class="content-main island">

				<!-- ================= SYNC ================= -->
				<template v-if="section === 'sync'">
					<div class="ops-banner" :class="sync.enabled ? 'ok' : 'warn'">
						<i class="bi" :class="sync.enabled ? 'bi-check-circle' : 'bi-exclamation-triangle'"></i>
						<span v-if="sync.enabled">{{ t('app.commerce-ops.sync.enabled', { domain: sync.shopDomain, version: sync.apiVersion }) }}</span>
						<span v-else>{{ t('app.commerce-ops.sync.disabled') }}</span>
					</div>

					<section class="property-group">
						<div class="property-group-title">{{ t('app.commerce-ops.sync.groupTitle') }}</div>

						<div class="ops-form">
							<div class="ops-field">
								<label class="property-label">{{ t('app.commerce-ops.sync.field.action') }}</label>
								<select class="wt w-100" v-model="form.action">
									<option value="inventory">{{ t('app.commerce-ops.sync.action.inventory') }}</option>
									<option value="price">{{ t('app.commerce-ops.sync.action.price') }}</option>
									<option value="publish">{{ t('app.commerce-ops.sync.action.publish') }}</option>
									<option value="metafields">{{ t('app.commerce-ops.sync.action.metafields') }}</option>
								</select>
							</div>

							<!-- inventory -->
							<template v-if="form.action === 'inventory'">
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.inventoryItemId') }}</label><input class="wt w-100" v-model="form.inventoryItemId" /></div>
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.locationId') }}</label><input class="wt w-100" v-model="form.locationId" /></div>
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.quantity') }}</label><input class="wt w-100" type="number" v-model="form.quantity" /></div>
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.reason') }}</label><input class="wt w-100" v-model="form.reason" :placeholder="t('app.commerce-ops.sync.field.reasonPlaceholder')" /></div>
							</template>
							<!-- price -->
							<template v-else-if="form.action === 'price'">
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.productId') }}</label><input class="wt w-100" v-model="form.productId" /></div>
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.variantId') }}</label><input class="wt w-100" v-model="form.variantId" /></div>
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.price') }}</label><input class="wt w-100" v-model="form.price" placeholder="19.99" /></div>
							</template>
							<!-- publish -->
							<template v-else-if="form.action === 'publish'">
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.productId') }}</label><input class="wt w-100" v-model="form.productId" /></div>
								<div class="ops-field">
									<label class="wt-checkbox-label"><input type="checkbox" class="wt" v-model="form.published"> {{ t('app.commerce-ops.sync.field.published') }}</label>
								</div>
							</template>
							<!-- metafields -->
							<template v-else-if="form.action === 'metafields'">
								<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.sync.field.productId') }}</label><input class="wt w-100" v-model="form.productId" /></div>
								<div class="property-hint">{{ t('app.commerce-ops.sync.metafieldsHint') }}</div>
							</template>
						</div>

						<div class="ops-actions">
							<label class="wt-checkbox-label"><input type="checkbox" class="wt" v-model="form.dryRun"> {{ t('app.commerce-ops.sync.dryRun') }}</label>
							<button class="wt wt-primary" :disabled="!canExecute" @click="executeSync">
								<i class="bi" :class="form.dryRun ? 'bi-clipboard-check' : 'bi-cloud-upload'"></i>
								{{ form.dryRun ? t('app.commerce-ops.sync.btn.validate') : t('app.commerce-ops.sync.btn.execute') }}
							</button>
						</div>

						<div v-if="syncResult" class="ops-result" :class="syncResult.ok ? 'ok' : 'err'">
							<div class="ops-result-head">
								<i class="bi" :class="syncResult.ok ? 'bi-check-lg' : 'bi-x-lg'"></i>
								{{ syncResult.title }}
							</div>
							<pre>{{ syncResult.body }}</pre>
						</div>
					</section>

					<section class="property-group">
						<div class="property-group-title">{{ t('app.commerce-ops.sync.recentTitle') }}</div>
						<div v-if="operations.length === 0" class="property-hint">{{ t('app.commerce-ops.sync.noOperations') }}</div>
						<table v-else class="ops-table">
							<thead><tr><th>{{ t('app.commerce-ops.table.when') }}</th><th>{{ t('app.commerce-ops.table.action') }}</th><th>{{ t('app.commerce-ops.table.status') }}</th><th>{{ t('app.commerce-ops.table.error') }}</th></tr></thead>
							<tbody>
								<tr v-for="(o, i) in operations" :key="i">
									<td>{{ fmtTime(o.at) }}</td>
									<td>{{ o.action }}</td>
									<td><span class="ops-pill" :class="'st-' + o.status">{{ o.status }}</span></td>
									<td class="ops-err">{{ o.error }}</td>
								</tr>
							</tbody>
						</table>
					</section>
				</template>

				<!-- ================= RECONCILE ================= -->
				<template v-else-if="section === 'reconcile'">
					<section class="property-group">
						<div class="property-group-title ops-section-head">
							<span>{{ t('app.commerce-ops.reconcile.groupTitle') }}</span>
							<button class="wt wt-primary wt-sm" :disabled="busy" @click="runReconcile">
								<i class="bi bi-play-fill"></i> {{ t('app.commerce-ops.reconcile.runNow') }}
							</button>
						</div>

						<div class="ops-kpis">
							<div class="ops-kpi"><span class="ops-kpi-v">{{ recon.productsWithDrift }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.reconcile.kpi.productsWithDrift') }}</span></div>
							<div class="ops-kpi"><span class="ops-kpi-v">{{ recon.totalDiffs }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.reconcile.kpi.fieldDiffs') }}</span></div>
							<div class="ops-kpi"><span class="ops-kpi-v">{{ recon.healed }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.reconcile.kpi.autoHealed') }}</span></div>
							<div class="ops-kpi"><span class="ops-kpi-v">{{ recon.checked }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.reconcile.kpi.checked') }}</span></div>
						</div>
						<div class="property-hint">
							<span v-if="recon.lastRunAt">{{ t('app.commerce-ops.reconcile.lastReport', { time: fmtTime(recon.lastRunAt) }) }}</span>
							<span v-if="recon.cursor"> {{ t('app.commerce-ops.reconcile.cursor', { cursor: recon.cursor }) }}</span>
							{{ t('app.commerce-ops.reconcile.healingNote') }}
						</div>
					</section>

					<section class="property-group">
						<div class="property-group-title">{{ t('app.commerce-ops.reconcile.driftTitle') }}</div>
						<div v-if="recon.diffs.length === 0" class="property-hint">{{ t('app.commerce-ops.reconcile.noDrift') }}</div>
						<table v-else class="ops-table">
							<thead><tr><th>{{ t('app.commerce-ops.table.product') }}</th><th>{{ t('app.commerce-ops.table.field') }}</th><th>{{ t('app.commerce-ops.table.variant') }}</th><th>{{ t('app.commerce-ops.table.cms') }}</th><th>{{ t('app.commerce-ops.table.shopify') }}</th><th>{{ t('app.commerce-ops.table.heal') }}</th></tr></thead>
							<tbody>
								<tr v-for="(d, i) in recon.diffs" :key="i">
									<td>{{ d.title || ('#' + d.productId) }}</td>
									<td>{{ d.field }}</td>
									<td>{{ d.variantId || '—' }}</td>
									<td class="ops-val">{{ d.cms }}</td>
									<td class="ops-val">{{ d.shopify }}</td>
									<td>
										<span class="ops-pill" :class="healClass(d)">{{ d.healed === 'ok' ? t('app.commerce-ops.reconcile.healedLabel') : d.heal }}</span>
									</td>
								</tr>
							</tbody>
						</table>
					</section>
				</template>

				<!-- ================= EVENTS ================= -->
				<template v-else-if="section === 'events'">
					<section class="property-group">
						<div class="property-group-title">{{ t('app.commerce-ops.events.groupTitle') }}</div>
						<div class="ops-kpis">
							<div class="ops-kpi"><span class="ops-kpi-v">{{ events.summary.total }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.events.kpi.total') }}</span></div>
							<div class="ops-kpi"><span class="ops-kpi-v">{{ events.summary.received }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.events.kpi.received') }}</span></div>
							<div class="ops-kpi"><span class="ops-kpi-v">{{ events.summary.processed }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.events.kpi.processed') }}</span></div>
							<div class="ops-kpi" :class="{ 'is-err': events.summary.error > 0 }"><span class="ops-kpi-v">{{ events.summary.error }}</span><span class="ops-kpi-l">{{ t('app.commerce-ops.events.kpi.error') }}</span></div>
						</div>
					</section>

					<section class="property-group">
						<div class="property-group-title ops-section-head">
							<span>{{ t('app.commerce-ops.events.logTitle') }}</span>
							<button class="wt wt-danger wt-sm" :disabled="busy || events.rows.length === 0" @click="replayMatching"
								:title="t('app.commerce-ops.events.replayMatchingHint')">
								<i class="bi bi-arrow-repeat"></i> {{ t('app.commerce-ops.events.replayMatchingBtn') }}
							</button>
						</div>

						<div class="ops-filter">
							<div class="ops-field">
								<label class="property-label">{{ t('app.commerce-ops.events.filter.status') }}</label>
								<select class="wt w-100" v-model="evFilter.status">
									<option value="error">{{ t('app.commerce-ops.events.filter.statusError') }}</option>
									<option value="received">{{ t('app.commerce-ops.events.filter.statusReceived') }}</option>
									<option value="processed">{{ t('app.commerce-ops.events.filter.statusProcessed') }}</option>
									<option value="">{{ t('app.commerce-ops.events.filter.statusAll') }}</option>
								</select>
							</div>
							<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.events.filter.source') }}</label><input class="wt w-100" v-model="evFilter.source" placeholder="shopify" /></div>
							<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.events.filter.topic') }}</label><input class="wt w-100" v-model="evFilter.topic" placeholder="orders/create" /></div>
							<div class="ops-field"><label class="property-label">{{ t('app.commerce-ops.events.filter.sinceDays') }}</label><input class="wt w-100" type="number" v-model="evFilter.sinceDays" placeholder="—" /></div>
							<button class="wt wt-sm" :disabled="busy" @click="loadEvents"><i class="bi bi-funnel"></i> {{ t('common.apply') }}</button>
						</div>

						<div v-if="events.rows.length === 0" class="property-hint">{{ t('app.commerce-ops.events.noEvents') }}</div>
						<table v-else class="ops-table">
							<thead><tr><th>{{ t('app.commerce-ops.table.when') }}</th><th>{{ t('app.commerce-ops.table.source') }}</th><th>{{ t('app.commerce-ops.table.topic') }}</th><th>{{ t('app.commerce-ops.table.event') }}</th><th>{{ t('app.commerce-ops.table.status') }}</th><th>{{ t('app.commerce-ops.table.tries') }}</th><th></th></tr></thead>
							<tbody>
								<tr v-for="(e, i) in events.rows" :key="e.path || i">
									<td>{{ fmtTime(e.received_at) }}</td>
									<td>{{ e.source }}</td>
									<td>{{ e.topic }}</td>
									<td class="ops-mono">{{ e.event_id }}</td>
									<td><span class="ops-pill" :class="'st-' + e.status">{{ e.status }}</span></td>
									<td>{{ e.attempts }}</td>
									<td><button class="btn-icon" :disabled="busy" @click="replayOne(e)" :title="t('app.commerce-ops.events.replayOneHint')"><i class="bi bi-arrow-repeat"></i></button></td>
								</tr>
							</tbody>
						</table>
					</section>
				</template>

			</main>
		</div>

		<!-- Status bar -->
		<div class="status-bar window-drag-region">
			<span class="nav-spacer"></span>
			<div class="status-group">
				<span v-if="busy" class="status-item"><i class="bi bi-arrow-repeat me-1"></i>{{ t('app.commerce-ops.statusbar.working') }}</span>
				<span v-else-if="statusKind === 'ok'" class="status-item status-ok"><i class="bi bi-check-lg me-1"></i>{{ status }}</span>
				<span v-else-if="statusKind === 'err'" class="status-item status-err">{{ status }}</span>
				<span v-else class="status-item">{{ t('app.commerce-ops.statusbar.ready') }}</span>
			</div>
		</div>

		<!-- Toast -->
		<div v-if="toast" class="commerce-toast" :class="{ error: toastError }" role="alert">{{ toast }}</div>

		<!-- Confirm dialog -->
		<div v-if="confirmDialog.visible" class="dialog-overlay">
			<div class="dialog-frame" style="max-width: 32rem;">
				<div class="island p-2">
					<div class="dialog-header"><h3><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ confirmDialog.title }}</h3></div>
					<div class="dialog-body"><p class="mt-0">{{ confirmDialog.message }}</p></div>
					<div class="dialog-footer flex-wrap">
						<button class="wt" @click="onConfirm(false)">{{ t('common.cancel') }}</button>
						<button class="wt wt-primary" @click="onConfirm(true)">{{ confirmDialog.ok }}</button>
					</div>
				</div>
			</div>
		</div>

	</div>

	<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>

</html>
