<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Commerce PIM</title>

	<!-- Bootstrap Icons (bundled with webtop) -->
	<link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css?v=__BUILD_VERSION__">

	<!-- App CSS + shared Webtop design system -->
	<link href="./assets/css/style.css?v=__BUILD_VERSION__" rel="stylesheet" />
	<link href="../../assets/css/webtop-app.css?v=__BUILD_VERSION__" rel="stylesheet" />
</head>

<body>
	<div id="app" v-cloak class="d-flex flex-column" @mounted="onMounted" @unmount="onUnmount">

		<!-- Top toolbar -->
		<nav class="nav-bar window-drag-region">
			<div class="toolbar-group">
				<button class="btn-icon" @click="save" :disabled="!hasChanges || saving || !product" title="Save overlay">
					<i class="bi bi-floppy"></i>
				</button>
				<button class="btn-icon" @click="revert" :disabled="!hasChanges || saving" title="Revert changes">
					<i class="bi bi-arrow-counterclockwise"></i>
				</button>
			</div>

			<div class="toolbar-group">
				<button class="btn-icon" @click="pushMetafields"
					:disabled="!product || pushing || metafields.length === 0 || !adminApiEnabled"
					:title="adminApiEnabled ? 'Push metafields to Shopify' : 'Admin API is disabled (see Commerce settings)'">
					<i class="bi bi-cloud-upload" :class="{ spin: pushing }"></i>
				</button>
			</div>

			<span class="nav-spacer"></span>

			<!-- Window controls -->
			<div class="window-controls">
				<button class="btn-icon" @click="onMinimizeWindow" title="Minimize">
					<i class="bi bi-dash-lg"></i>
				</button>
				<button class="btn-icon" @click="onToggleMaximizeWindow" title="Maximize">
					<i class="bi bi-square"></i>
				</button>
				<button class="btn-icon window-control-close" @click="onCloseWindow" title="Close">
					<i class="bi bi-x-lg"></i>
				</button>
			</div>
		</nav>

		<!-- Content -->
		<div class="content-body">

			<!-- Left: search + results -->
			<aside class="pim-sidebar island">
				<div class="pim-search">
					<div class="input-group">
						<input type="search" v-model="searchQuery" placeholder="Search products…"
							@keyup.enter="search" />
						<div class="input-group-actions">
							<button class="input-group-btn" @click="search" :disabled="searching" title="Search">
								<i class="bi" :class="searching ? 'bi-arrow-repeat spin' : 'bi-search'"></i>
							</button>
							<button class="input-group-btn" v-if="searchQuery" @click="clearSearch"
								:disabled="searching" title="Clear">
								<i class="bi bi-x-lg"></i>
							</button>
						</div>
					</div>
				</div>

				<div class="pim-results">
					<div v-if="searching" class="pim-hint"><div class="spinner"></div></div>
					<div v-else-if="searched && results.length === 0" class="pim-hint">No products found.</div>
					<div v-else-if="!searched" class="pim-hint">Search the catalog to begin.</div>
					<button v-for="r in results" :key="r.productId" class="pim-result"
						:class="{ active: product && product.productId === r.productId }"
						@click="selectProduct(r.productId)">
						<span class="pim-result-title">{{ r.title || ('#' + r.productId) }}</span>
						<span class="pim-result-sub">
							<span class="pim-status" :class="'st-' + (r.status || 'unknown')">{{ r.status || '—' }}</span>
							<span class="pim-result-handle">{{ r.handle }}</span>
						</span>
					</button>
				</div>
			</aside>

			<!-- Right: editor -->
			<main class="content-main island">

				<div v-if="loading" class="pim-state"><div class="spinner"></div><span>Loading product&hellip;</span></div>

				<div v-else-if="!product" class="pim-state">
					<i class="bi bi-tags"></i>
					<span>Select a product to edit its information overlay.</span>
				</div>

				<template v-else>
					<!-- Product header (read-only base from Shopify) -->
					<header class="pim-head">
						<div>
							<h2 class="pim-title">{{ base.title || ('Product #' + product.productId) }}</h2>
							<div class="pim-meta">
								<span class="pim-status" :class="'st-' + (base.status || 'unknown')">{{ base.status || '—' }}</span>
								<span v-if="base.handle">/{{ base.handle }}</span>
								<span>· #{{ product.productId }}</span>
								<span v-if="base.vendor">· {{ base.vendor }}</span>
								<span v-if="base.productType">· {{ base.productType }}</span>
							</div>
							<div v-if="overlayStamp" class="pim-stamp">Overlay updated {{ overlayStamp }}</div>
						</div>
					</header>

					<!-- Base reference (read-only) -->
					<details class="pim-base">
						<summary>Shopify base &amp; variants ({{ base.variants.length }})</summary>
						<div v-if="base.tags" class="pim-base-tags">Tags: {{ base.tags }}</div>
						<table class="pim-vtable">
							<thead><tr><th>Variant</th><th>SKU</th><th>Price</th></tr></thead>
							<tbody>
								<tr v-for="v in base.variants" :key="v.id">
									<td>{{ v.title }}</td><td>{{ v.sku }}</td><td>{{ v.price }}</td>
								</tr>
							</tbody>
						</table>
					</details>

					<!-- Localized content -->
					<section class="property-group">
						<div class="property-group-title pim-section-head">
							<span><i class="bi bi-translate me-2"></i>Localized content</span>
							<button class="wt wt-sm" @click="addLocale"><i class="bi bi-plus-lg me-1"></i>Locale</button>
						</div>
						<div v-if="localized.length === 0" class="property-hint">No localized titles/descriptions yet.</div>
						<div v-for="(loc, i) in localized" :key="i" class="pim-card">
							<div class="pim-row">
								<div class="pim-col-locale">
									<label class="property-label">Locale</label>
									<input type="text" class="wt w-100" v-model="loc.locale" placeholder="ja, en, …" />
								</div>
								<div class="pim-col-grow">
									<label class="property-label">Title</label>
									<input type="text" class="wt w-100" v-model="loc.title" />
								</div>
								<button class="btn-icon pim-del" @click="localized.splice(i, 1)" title="Remove locale">
									<i class="bi bi-trash"></i>
								</button>
							</div>
							<div>
								<label class="property-label">Description (HTML)</label>
								<textarea class="wt w-100" rows="3" v-model="loc.description_html"></textarea>
							</div>
						</div>
					</section>

					<!-- Custom attributes -->
					<section class="property-group">
						<div class="property-group-title pim-section-head">
							<span><i class="bi bi-list-ul me-2"></i>Custom attributes</span>
							<button class="wt wt-sm" @click="addAttribute"><i class="bi bi-plus-lg me-1"></i>Attribute</button>
						</div>
						<div v-if="attributes.length === 0" class="property-hint">No custom attributes yet.</div>
						<div v-for="(a, i) in attributes" :key="i" class="pim-row">
							<div class="pim-col-key">
								<label class="property-label" v-if="i === 0">Key</label>
								<input type="text" class="wt w-100" v-model="a.key" placeholder="material" />
							</div>
							<div class="pim-col-grow">
								<label class="property-label" v-if="i === 0">Value</label>
								<input type="text" class="wt w-100" v-model="a.value" placeholder="cotton" />
							</div>
							<button class="btn-icon pim-del" @click="attributes.splice(i, 1)" title="Remove attribute">
								<i class="bi bi-trash"></i>
							</button>
						</div>
					</section>

					<!-- Metafields (pushable to Shopify) -->
					<section class="property-group">
						<div class="property-group-title pim-section-head">
							<span><i class="bi bi-cloud me-2"></i>Metafields</span>
							<button class="wt wt-sm" @click="addMetafield"><i class="bi bi-plus-lg me-1"></i>Metafield</button>
						</div>
						<div class="property-hint">CMS-authored metafields can be pushed to Shopify via the toolbar
							(requires the Admin API).</div>
						<div v-for="(m, i) in metafields" :key="i" class="pim-row pim-mf">
							<div class="pim-col-mf">
								<label class="property-label" v-if="i === 0">Namespace</label>
								<input type="text" class="wt w-100" v-model="m.namespace" placeholder="custom" />
							</div>
							<div class="pim-col-mf">
								<label class="property-label" v-if="i === 0">Key</label>
								<input type="text" class="wt w-100" v-model="m.key" placeholder="care" />
							</div>
							<div class="pim-col-mf">
								<label class="property-label" v-if="i === 0">Type</label>
								<input type="text" class="wt w-100" v-model="m.type" placeholder="single_line_text_field" />
							</div>
							<div class="pim-col-grow">
								<label class="property-label" v-if="i === 0">Value</label>
								<input type="text" class="wt w-100" v-model="m.value" />
							</div>
							<button class="btn-icon pim-del" @click="metafields.splice(i, 1)" title="Remove metafield">
								<i class="bi bi-trash"></i>
							</button>
						</div>
					</section>
				</template>
			</main>
		</div>

		<!-- Status bar -->
		<div class="status-bar window-drag-region">
			<span class="nav-spacer"></span>
			<div class="status-group">
				<span v-if="saving" class="status-item"><i class="bi bi-arrow-repeat me-1"></i>Saving&hellip;</span>
				<span v-else-if="pushing" class="status-item"><i class="bi bi-cloud-upload me-1"></i>Pushing&hellip;</span>
				<span v-else-if="hasChanges" class="status-item">Unsaved changes</span>
				<span v-else-if="statusKind === 'ok'" class="status-item status-ok"><i class="bi bi-check-lg me-1"></i>{{ status }}</span>
				<span v-else-if="statusKind === 'err'" class="status-item status-err">{{ status }}</span>
				<span v-else class="status-item">Ready</span>
			</div>
		</div>

		<!-- Toast -->
		<div v-if="toast" class="commerce-toast" :class="{ error: toastError }" role="alert">{{ toast }}</div>

		<!-- Unsaved-changes dialog -->
		<div v-if="confirmDialog.visible" class="dialog-overlay">
			<div class="dialog-frame" style="max-width: 32rem;">
				<div class="island p-2">
					<div class="dialog-header">
						<h3><i class="bi bi-exclamation-triangle-fill me-2"></i>Unsaved Changes</h3>
					</div>
					<div class="dialog-body">
						<p class="mt-0">You have unsaved changes to this product.</p>
						<p>Do you want to save them first?</p>
					</div>
					<div class="dialog-footer flex-wrap">
						<button class="wt" @click="onConfirmAction('cancel')">Cancel</button>
						<button class="wt wt-danger" @click="onConfirmAction('discard')">
							<i class="bi bi-trash me-1"></i>Don't Save
						</button>
						<button class="wt wt-primary" @click="onConfirmAction('save')">
							<i class="bi bi-floppy me-1"></i>Save
						</button>
					</div>
				</div>
			</div>
		</div>

	</div>

	<script type="module" src="./app.js?v=__BUILD_VERSION__"></script>
</body>

</html>
