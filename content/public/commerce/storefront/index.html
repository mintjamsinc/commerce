<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storefront</title>
<style>
:root {
	color-scheme: light dark;
	--bg:            light-dark(#f7f8fa, #0f172a);
	--surface:       light-dark(#ffffff, #1e293b);
	--surface-soft:  light-dark(#f3f4f6, #233044);
	--border:        light-dark(#e5e7eb, #334155);
	--border-strong: light-dark(#d1d5db, #475569);
	--text:          light-dark(#1f2937, #f1f5f9);
	--text-soft:     light-dark(#4b5563, #cbd5e1);
	--text-muted:    light-dark(#6b7280, #94a3b8);
	--primary:       light-dark(#2563eb, #3b82f6);
	--primary-hover: light-dark(#1d4ed8, #60a5fa);
	--primary-fg:    #ffffff;
	--success:       light-dark(#059669, #34d399);
	--success-soft:  light-dark(rgba(5,150,105,.1), rgba(52,211,153,.14));
	--warning:       light-dark(#b45309, #fbbf24);
	--warning-soft:  light-dark(rgba(180,83,9,.1), rgba(251,191,36,.16));
	--danger:        light-dark(#dc2626, #f87171);
	--danger-soft:   light-dark(rgba(220,38,38,.08), rgba(248,113,113,.16));
	--shadow-sm: 0 1px 2px rgba(0,0,0,.05);
	--shadow-md: 0 4px 12px rgba(0,0,0,.08);
	--radius: 0.6rem;
	--radius-sm: 0.4rem;
}
* { box-sizing: border-box; color: inherit; font-family: inherit; }
html { font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
[v-cloak] { display: none !important; }
a { color: var(--primary); text-decoration: none; }
img { max-width: 100%; display: block; }

/* Header */
.sf-header {
	position: sticky; top: 0; z-index: 10;
	display: flex; align-items: center; gap: 1rem;
	padding: 0.85rem 1.25rem;
	background: var(--surface); border-bottom: 1px solid var(--border);
}
.sf-brand { font-size: 1.15rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
.sf-search { flex: 1; max-width: 32rem; }
.sf-search input {
	width: 100%; padding: 0.5rem 0.85rem; font-size: 0.95rem;
	border: 1px solid var(--border-strong); border-radius: 9999px;
	background: var(--bg); color: var(--text);
}
.sf-search input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.sf-cart-btn {
	position: relative; display: inline-flex; align-items: center; gap: 0.4rem;
	padding: 0.5rem 0.9rem; border: 1px solid var(--border-strong);
	border-radius: 9999px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: 0.9rem;
}
.sf-cart-btn:hover { background: var(--surface-soft); }
.sf-cart-count {
	min-width: 1.25rem; height: 1.25rem; padding: 0 0.35rem;
	display: inline-flex; align-items: center; justify-content: center;
	background: var(--primary); color: var(--primary-fg);
	border-radius: 9999px; font-size: 0.72rem; font-weight: 700;
}

/* Layout */
.sf-main { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
.sf-state { text-align: center; color: var(--text-muted); padding: 4rem 1rem; }
.spinner { width: 1.6rem; height: 1.6rem; border: 2px solid var(--border-strong); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 0.75rem; }
@keyframes spin { to { transform: rotate(360deg); } }

.sf-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 1.25rem; }
.sf-count { color: var(--text-muted); font-size: 0.9rem; }
.sf-sort select { padding: 0.4rem 0.6rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }

/* Catalog grid */
.sf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.25rem; }
.sf-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
.sf-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.sf-card-img { aspect-ratio: 1 / 1; background: var(--surface-soft); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.sf-card-img img { width: 100%; height: 100%; object-fit: cover; }
.sf-card-img .ph { color: var(--text-muted); font-size: 0.8rem; }
.sf-card-body { padding: 0.85rem 0.95rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; flex: 1; }
.sf-card-vendor { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
.sf-card-title { font-weight: 600; font-size: 0.95rem; }
.sf-card-price { margin-top: auto; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Availability badge */
.badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.1rem 0.5rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 700; width: fit-content; }
.badge.low { background: var(--warning-soft); color: var(--warning); }
.badge.out { background: var(--danger-soft); color: var(--danger); }
.badge.in  { background: var(--success-soft); color: var(--success); }

/* Product detail */
.sf-back { background: none; border: none; color: var(--text-soft); cursor: pointer; padding: 0; margin-bottom: 1rem; font-size: 0.9rem; }
.sf-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
@media (max-width: 46rem) { .sf-detail { grid-template-columns: 1fr; } }
.sf-gallery { display: flex; flex-direction: column; gap: 0.6rem; }
.sf-gallery-main { aspect-ratio: 1 / 1; background: var(--surface-soft); border-radius: var(--radius); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.sf-gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.sf-thumbs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.sf-thumb { width: 4rem; height: 4rem; border-radius: var(--radius-sm); overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--surface-soft); }
.sf-thumb.active { border-color: var(--primary); }
.sf-detail h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
.sf-detail-price { font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 0.5rem 0 1rem; }
.sf-compare { color: var(--text-muted); text-decoration: line-through; font-size: 1rem; font-weight: 500; margin-left: 0.5rem; }
.sf-field { margin: 0.85rem 0; }
.sf-field label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 0.3rem; font-weight: 600; }
.sf-field select, .sf-qty input { padding: 0.5rem 0.65rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 0.95rem; }
.sf-qty input { width: 5rem; }
.sf-desc { margin-top: 1.5rem; color: var(--text-soft); font-size: 0.95rem; }
.sf-desc :where(h1,h2,h3) { font-size: 1.05rem; }

/* Buttons */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.7rem 1.25rem; border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 700; cursor: pointer; border: 1px solid transparent; background: var(--surface); color: var(--text); }
.btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); width: 100%; }
.btn-primary:not(:disabled):hover { background: var(--primary-hover); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-secondary { border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-soft); }

/* Cart */
.sf-cart-list { display: flex; flex-direction: column; gap: 0.75rem; }
.sf-cart-row { display: grid; grid-template-columns: 4.5rem 1fr auto auto; gap: 1rem; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; }
.sf-cart-thumb { width: 4.5rem; height: 4.5rem; border-radius: var(--radius-sm); object-fit: cover; background: var(--surface-soft); }
.sf-cart-meta { font-size: 0.9rem; }
.sf-cart-variant { color: var(--text-muted); font-size: 0.8rem; }
.sf-cart-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
.sf-cart-remove:hover { color: var(--danger); }
.sf-summary { margin-top: 1.5rem; padding: 1.25rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 22rem; margin-left: auto; }
.sf-summary-row { display: flex; justify-content: space-between; font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; }
.sf-empty { text-align: center; color: var(--text-muted); padding: 3rem 1rem; }

.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 0.6rem 1.1rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-md); font-size: 0.9rem; z-index: 100; }
</style>
</head>
<body>
<main id="app" v-cloak @mounted="onMounted" @unmount="onUnmount">

	<header class="sf-header">
		<div class="sf-brand" @click="go('#/')">{{ store.name || 'Store' }}</div>
		<div class="sf-search">
			<input type="search" v-model="query" placeholder="Search products…" @focus="go('#/')" />
		</div>
		<button class="sf-cart-btn" @click="go('#/cart')">
			<span>Cart</span>
			<span v-if="cartCount > 0" class="sf-cart-count">{{ cartCount }}</span>
		</button>
	</header>

	<!-- Loading / error -->
	<div v-if="view === 'loading'" class="sf-state"><div class="spinner"></div>Loading store…</div>
	<div v-else-if="view === 'error'" class="sf-state">{{ errorMessage }}</div>

	<main v-else class="sf-main">

		<!-- ===== Catalog ===== -->
		<template v-if="view === 'catalog'">
			<div class="sf-toolbar">
				<span class="sf-count">{{ filteredProducts.length }} {{ filteredProducts.length === 1 ? 'product' : 'products' }}</span>
				<div class="sf-sort">
					<select v-model="sortBy">
						<option value="title">Name</option>
						<option value="price-asc">Price: low to high</option>
						<option value="price-desc">Price: high to low</option>
					</select>
				</div>
			</div>
			<div v-if="filteredProducts.length === 0" class="sf-empty">No products found.</div>
			<div v-else class="sf-grid">
				<div v-for="p in filteredProducts" :key="p.id" class="sf-card" @click="go('#/product/' + p.handle)">
					<div class="sf-card-img">
						<img v-if="p.image" :src="p.image" :alt="p.title" loading="lazy" />
						<span v-else class="ph">No image</span>
					</div>
					<div class="sf-card-body">
						<span v-if="p.vendor" class="sf-card-vendor">{{ p.vendor }}</span>
						<span class="sf-card-title">{{ p.title }}</span>
						<span v-if="cardBadge(p)" class="badge" :class="cardBadge(p).cls">{{ cardBadge(p).label }}</span>
						<span class="sf-card-price">{{ priceRange(p) }}</span>
					</div>
				</div>
			</div>
		</template>

		<!-- ===== Product detail ===== -->
		<template v-else-if="view === 'product'">
			<button class="sf-back" @click="go('#/')">&larr; Back to catalog</button>
			<div v-if="!product" class="sf-state"><div class="spinner"></div>Loading…</div>
			<div v-else class="sf-detail">
				<div class="sf-gallery">
					<div class="sf-gallery-main">
						<img v-if="activeImage" :src="activeImage" :alt="product.title" />
						<span v-else class="ph" style="color:var(--text-muted)">No image</span>
					</div>
					<div v-if="product.images && product.images.length > 1" class="sf-thumbs">
						<div v-for="(img, i) in product.images" :key="i" class="sf-thumb" :class="{ active: i === activeImageIndex }" @click="activeImageIndex = i">
							<img :src="img.src" :alt="img.alt || product.title" />
						</div>
					</div>
				</div>
				<div>
					<span v-if="product.vendor" class="sf-card-vendor">{{ product.vendor }}</span>
					<h1>{{ product.title }}</h1>
					<div class="sf-detail-price">
						{{ formatPrice(selectedVariant ? selectedVariant.price : null) }}
						<span v-if="selectedVariant && hasCompare(selectedVariant)" class="sf-compare">{{ formatPrice(selectedVariant.compareAtPrice) }}</span>
					</div>

					<span v-if="variantBadge" class="badge" :class="variantBadge.cls">{{ variantBadge.label }}</span>

					<div v-if="product.variants && product.variants.length > 1" class="sf-field">
						<label>Variant</label>
						<select v-model="selectedVariantId">
							<option v-for="v in product.variants" :key="v.id" :value="v.id">{{ v.title }}</option>
						</select>
					</div>

					<div class="sf-field sf-qty">
						<label>Quantity</label>
						<input type="number" min="1" v-model="qty" />
					</div>

					<div style="margin-top:1.25rem; max-width: 22rem;">
						<button class="btn btn-primary" :disabled="!canAddToCart" @click="addToCart">
							{{ soldOut ? 'Sold out' : 'Add to cart' }}
						</button>
					</div>

					<div v-if="product.bodyHtml" class="sf-desc" v-html="product.bodyHtml"></div>
				</div>
			</div>
		</template>

		<!-- ===== Cart ===== -->
		<template v-else-if="view === 'cart'">
			<button class="sf-back" @click="go('#/')">&larr; Continue shopping</button>
			<h1 style="font-size:1.5rem;margin:0 0 1.25rem;">Your cart</h1>
			<div v-if="cart.length === 0" class="sf-empty">Your cart is empty.</div>
			<template v-else>
				<div class="sf-cart-list">
					<div v-for="(item, i) in cart" :key="item.variantId" class="sf-cart-row">
						<img class="sf-cart-thumb" v-if="item.image" :src="item.image" :alt="item.title" />
						<div class="sf-cart-meta">
							<div style="font-weight:600">{{ item.title }}</div>
							<div v-if="item.variantTitle && item.variantTitle !== 'Default Title'" class="sf-cart-variant">{{ item.variantTitle }}</div>
							<div class="sf-cart-variant">{{ formatPrice(item.price) }}</div>
						</div>
						<div class="sf-qty"><input type="number" min="1" :value="item.qty" @change="setQty(i, $event)" /></div>
						<button class="sf-cart-remove" title="Remove" @click="removeFromCart(i)">&times;</button>
					</div>
				</div>
				<div class="sf-summary">
					<div class="sf-summary-row"><span>Total</span><span>{{ formatPrice(cartTotal) }}</span></div>
					<button class="btn btn-primary" :disabled="!canCheckout" @click="checkout">Checkout</button>
					<p v-if="!store.shopDomain" style="color:var(--text-muted);font-size:0.8rem;margin:0.75rem 0 0;text-align:center;">Checkout is not configured.</p>
				</div>
			</template>
		</template>

	</main>

	<div v-if="toast" class="toast">{{ toast }}</div>
</main>

<script type="module">
import { VDOM } from 'https://cdn.jsdelivr.net/npm/@mintjamsinc/ichigojs/dist/ichigo.esm.min.js';

const CART_KEY = 'commerce.cart';
const POLL_MS = 30000;

function num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }

const App = {
	data() {
		return {
			view: 'loading',
			errorMessage: '',
			store: {},
			products: [],
			liveItems: {},          // inventory_item_id -> available (live)
			query: '',
			sortBy: 'title',
			product: null,          // current detail
			selectedVariantId: '',
			activeImageIndex: 0,
			qty: 1,
			cart: [],
			toast: '',
			_hashListener: null,
			_pollTimer: null,
			_toastTimer: null,
		};
	},

	computed: {
		lowStock() { return num(this.store.lowStock) ?? 5; },
		cartCount() { return this.cart.reduce((n, i) => n + (Number(i.qty) || 0), 0); },
		cartTotal() { return this.cart.reduce((s, i) => s + (num(i.price) || 0) * (Number(i.qty) || 0), 0); },
		canCheckout() { return this.cart.length > 0 && !!this.store.shopDomain; },

		filteredProducts() {
			const q = (this.query || '').trim().toLowerCase();
			let list = this.products.slice();
			if (q) {
				list = list.filter((p) => {
					const hay = [p.title, p.vendor, p.productType, ...(p.tags || [])].filter(Boolean).join(' ').toLowerCase();
					return hay.includes(q);
				});
			}
			if (this.sortBy === 'price-asc') list.sort((a, b) => (num(a.priceMin) ?? 1e15) - (num(b.priceMin) ?? 1e15));
			else if (this.sortBy === 'price-desc') list.sort((a, b) => (num(b.priceMax) ?? -1) - (num(a.priceMax) ?? -1));
			else list.sort((a, b) => String(a.title || '').localeCompare(String(b.title || '')));
			return list;
		},

		selectedVariant() {
			if (!this.product || !Array.isArray(this.product.variants)) return null;
			return this.product.variants.find((v) => String(v.id) === String(this.selectedVariantId)) || this.product.variants[0] || null;
		},
		activeImage() {
			const imgs = (this.product && this.product.images) || [];
			if (imgs.length === 0) return null;
			return (imgs[this.activeImageIndex] || imgs[0]).src;
		},
		variantBadge() { return this.selectedVariant ? this.badgeFor(this.liveAvailable(this.selectedVariant)) : null; },
		soldOut() {
			const b = this.variantBadge;
			return !!(b && b.cls === 'out');
		},
		canAddToCart() { return !!this.selectedVariant && !this.soldOut; },
	},

	methods: {
		async onMounted() {
			this._hashListener = () => this.route();
			window.addEventListener('hashchange', this._hashListener);
			this.loadCart();
			try {
				await this.loadStore();
				await this.loadIndex();
				this.route();
				this._pollTimer = window.setInterval(() => this.pollInventory(), POLL_MS);
			} catch (e) {
				this.errorMessage = (e && e.message) ? e.message : 'Failed to load the store.';
				this.view = 'error';
			}
		},
		onUnmount() {
			if (this._hashListener) window.removeEventListener('hashchange', this._hashListener);
			if (this._pollTimer) clearInterval(this._pollTimer);
			if (this._toastTimer) clearTimeout(this._toastTimer);
		},

		// ---- Data ----
		async fetchJson(rel) {
			const res = await fetch(rel, { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' });
			if (!res.ok) throw new Error('Request failed (' + res.status + ')');
			return res.json();
		},
		async loadStore() { try { this.store = await this.fetchJson('../catalog/store.json'); } catch (_) { this.store = {}; } },
		async loadIndex() {
			const idx = await this.fetchJson('../catalog/index.json');
			this.products = Array.isArray(idx.products) ? idx.products : [];
			this.applyLive();
		},
		async pollInventory() {
			try {
				const inv = await this.fetchJson('../catalog/inventory.json');
				this.liveItems = (inv && inv.items) || {};
				this.applyLive();
			} catch (_) { /* keep last */ }
		},
		// Seed liveItems from the published snapshot the first time.
		applyLive() { /* live overrides happen in liveAvailable(); nothing to precompute */ },

		// ---- Routing ----
		go(hash) { if (location.hash === hash) this.route(); else location.hash = hash; },
		route() {
			const h = location.hash || '#/';
			if (h.startsWith('#/product/')) {
				this.view = 'product';
				this.loadProduct(decodeURIComponent(h.slice('#/product/'.length)));
			} else if (h === '#/cart') {
				this.view = 'cart';
				window.scrollTo(0, 0);
			} else {
				this.view = 'catalog';
			}
		},
		async loadProduct(handle) {
			this.product = null; this.activeImageIndex = 0; this.qty = 1;
			const card = this.products.find((p) => p.handle === handle) || this.products.find((p) => String(p.id) === handle);
			if (!card) { this.showToast('Product not found.'); return; }
			try {
				const detail = await this.fetchJson('../catalog/products/' + encodeURIComponent(card.id) + '.json');
				this.product = detail;
				const firstAvail = (detail.variants || []).find((v) => this.badgeFor(this.liveAvailable(v)).cls !== 'out');
				this.selectedVariantId = String((firstAvail || (detail.variants || [])[0] || {}).id || '');
				document.title = (detail.title || 'Product') + ' — ' + (this.store.name || 'Store');
			} catch (e) { this.showToast('Could not load product.'); }
		},

		// ---- Availability (#21) ----
		// Live quantity for a variant: the polled value wins over the published snapshot.
		liveAvailable(variant) {
			if (!variant) return null;
			const id = variant.inventoryItemId;
			if (id != null && Object.prototype.hasOwnProperty.call(this.liveItems, id)) return Number(this.liveItems[id]);
			return variant.available != null ? Number(variant.available) : null;
		},
		badgeFor(available) {
			if (available == null) return { cls: '', label: '' };          // untracked → purchasable, no badge
			if (available <= 0) return { cls: 'out', label: 'Sold out' };
			if (available <= this.lowStock) return { cls: 'low', label: 'Only ' + available + ' left' };
			return { cls: 'in', label: 'In stock' };
		},
		// Catalog card: aggregate live availability across the card's items.
		cardBadge(card) {
			const ids = card.inventoryItemIds || [];
			let tracked = false, total = 0;
			for (const id of ids) {
				if (Object.prototype.hasOwnProperty.call(this.liveItems, id)) { tracked = true; total += Number(this.liveItems[id]) || 0; }
			}
			let available = tracked ? total : (card.available != null ? Number(card.available) : null);
			const b = this.badgeFor(available);
			return b.cls ? b : null;
		},

		// ---- Cart ----
		loadCart() { try { const r = localStorage.getItem(CART_KEY); this.cart = r ? JSON.parse(r) : []; } catch (_) { this.cart = []; } },
		saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(this.cart)); } catch (_) {} },
		addToCart() {
			const v = this.selectedVariant; if (!v || this.soldOut) return;
			const qty = Math.max(1, parseInt(this.qty, 10) || 1);
			const existing = this.cart.find((i) => String(i.variantId) === String(v.id));
			if (existing) existing.qty = (Number(existing.qty) || 0) + qty;
			else this.cart.push({
				variantId: String(v.id), productId: this.product.id, handle: this.product.handle,
				title: this.product.title, variantTitle: v.title, price: v.price,
				image: (this.product.images && this.product.images[0]) ? this.product.images[0].src : null, qty: qty,
			});
			this.saveCart();
			this.showToast('Added to cart');
		},
		setQty(i, ev) {
			const n = Math.max(1, parseInt(ev && ev.target ? ev.target.value : '1', 10) || 1);
			this.cart[i].qty = n; this.saveCart();
		},
		removeFromCart(i) { this.cart.splice(i, 1); this.saveCart(); },

		// ---- Checkout (#20): Shopify hosted checkout via cart permalink ----
		checkout() {
			if (!this.canCheckout) return;
			const items = this.cart.map((i) => encodeURIComponent(i.variantId) + ':' + (Number(i.qty) || 1)).join(',');
			const domain = String(this.store.shopDomain || '').replace(/^https?:\/\//, '').replace(/\/+$/, '');
			if (!domain) { this.showToast('Checkout is not configured.'); return; }
			window.location.href = 'https://' + domain + '/cart/' + items;
		},

		// ---- Format / UI ----
		hasCompare(v) { const c = num(v.compareAtPrice), p = num(v.price); return c != null && p != null && c > p; },
		formatPrice(v) {
			const n = num(v); if (n == null) return '';
			const cur = this.store.currency || '';
			const s = n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
			return cur ? s + ' ' + cur : s;
		},
		priceRange(card) {
			const lo = num(card.priceMin), hi = num(card.priceMax);
			if (lo == null) return '';
			if (hi != null && hi !== lo) return this.formatPrice(lo) + ' – ' + this.formatPrice(hi);
			return this.formatPrice(lo);
		},
		showToast(msg) { this.toast = msg; if (this._toastTimer) clearTimeout(this._toastTimer); this._toastTimer = setTimeout(() => { this.toast = ''; }, 2500); },
	},
};

VDOM.createApp(App).mount('#app');
</script>
