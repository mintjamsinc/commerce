<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing</title>
<style>
:root {
	color-scheme: light dark;
	--bg:            light-dark(#f7f8fa, #0f172a);
	--surface:       light-dark(#ffffff, #1e293b);
	--surface-soft:  light-dark(#f3f4f6, #233044);
	--border:        light-dark(#e5e7eb, #334155);
	--border-strong: light-dark(#d1d5db, #475569);
	--text:          light-dark(#1f2937, #f1f5f9);
	--text-soft:     light-dark(#4b5563, #cbd5e1);
	--text-muted:    light-dark(#6b7280, #94a3b8);
	--primary:       light-dark(#2563eb, #3b82f6);
	--primary-hover: light-dark(#1d4ed8, #60a5fa);
	--primary-fg:    #ffffff;
	--success:       light-dark(#059669, #34d399);
	--success-soft:  light-dark(rgba(5,150,105,.1), rgba(52,211,153,.14));
	--warning:       light-dark(#b45309, #fbbf24);
	--warning-soft:  light-dark(rgba(180,83,9,.1), rgba(251,191,36,.16));
	--danger:        light-dark(#dc2626, #f87171);
	--danger-soft:   light-dark(rgba(220,38,38,.08), rgba(248,113,113,.16));
	--shadow-sm: 0 1px 2px rgba(0,0,0,.05);
	--shadow-md: 0 4px 12px rgba(0,0,0,.08);
	--radius: 0.6rem; --radius-sm: 0.4rem;
}
* { box-sizing: border-box; color: inherit; font-family: inherit; }
html { font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; }
[v-cloak] { display: none !important; }
a { color: var(--primary); text-decoration: none; }
img { max-width: 100%; display: block; }

.sf-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--border); }
.sf-brand { font-size: 1.15rem; font-weight: 800; cursor: pointer; }
.sf-nav { margin-left: auto; display: flex; gap: 1rem; align-items: center; font-size: 0.9rem; font-weight: 600; }

.sf-main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
.sf-state { text-align: center; color: var(--text-muted); padding: 4rem 1rem; }
.spinner { width: 1.6rem; height: 1.6rem; border: 2px solid var(--border-strong); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 0.75rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Blocks */
.blk { margin: 2rem 0; }
.blk-prose :where(h1,h2,h3) { line-height: 1.25; }
.blk-prose h2 { font-size: 1.5rem; margin: 1.5rem 0 0.75rem; }
.blk-prose h3 { font-size: 1.2rem; margin: 1.25rem 0 0.5rem; }
.blk-prose p { margin: 0.75rem 0; color: var(--text-soft); }
.blk-prose ul, .blk-prose ol { color: var(--text-soft); padding-left: 1.4rem; }
.blk-prose code { background: var(--surface-soft); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.9em; }
.blk-prose img { border-radius: var(--radius); margin: 1rem 0; }

.hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center; box-shadow: var(--shadow-sm); }
.hero.has-img { background-size: cover; background-position: center; color: #fff; border: none; }
.hero h1 { margin: 0 0 0.5rem; font-size: 2rem; }
.hero p { margin: 0 0 1.25rem; font-size: 1.05rem; opacity: 0.95; }
.hero .btn { display: inline-flex; }

.blk-title { font-size: 1.4rem; font-weight: 700; margin: 0 0 1rem; }

.sf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 1.1rem; }
.sf-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
.sf-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.sf-card-img { aspect-ratio: 1/1; background: var(--surface-soft); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.sf-card-img img { width: 100%; height: 100%; object-fit: cover; }
.sf-card-img .ph { color: var(--text-muted); font-size: 0.8rem; }
.sf-card-body { padding: 0.75rem 0.85rem 0.9rem; display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
.sf-card-title { font-weight: 600; font-size: 0.92rem; }
.sf-card-price { margin-top: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; padding: 0.1rem 0.5rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 700; width: fit-content; }
.badge.low { background: var(--warning-soft); color: var(--warning); }
.badge.out { background: var(--danger-soft); color: var(--danger); }
.badge.in  { background: var(--success-soft); color: var(--success); }

.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.7rem 1.4rem; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-fg); }
.btn:hover { background: var(--primary-hover); }
</style>
</head>
<body>
<main id="app" v-cloak @mounted="onMounted" @unmount="onUnmount">

	<header class="sf-header">
		<div class="sf-brand" @click="goStorefront('#/')">{{ store.name || 'Store' }}</div>
		<nav class="sf-nav">
			<a :href="storefrontUrl">Shop</a>
		</nav>
	</header>

	<div v-if="view === 'loading'" class="sf-state"><div class="spinner"></div>Loading…</div>
	<div v-else-if="view === 'error'" class="sf-state">{{ errorMessage }}</div>

	<main v-else class="sf-main">
		<header v-if="page.title" style="margin-bottom:1.5rem;">
			<h1 style="font-size:1.8rem;margin:0 0 0.25rem;">{{ page.title }}</h1>
			<p v-if="page.subtitle" style="color:var(--text-muted);margin:0;">{{ page.subtitle }}</p>
		</header>

		<div v-for="(b, i) in page.blocks" :key="i" class="blk">
			<!-- Hero -->
			<div v-if="b.type === 'hero'" class="hero" :class="{ 'has-img': !!b.image }" :style="b.image ? ('background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url(' + b.image + ')') : ''">
				<h1>{{ b.title }}</h1>
				<p v-if="b.subtitle">{{ b.subtitle }}</p>
				<a v-if="b.ctaText" class="btn" :href="b.ctaHref || storefrontUrl">{{ b.ctaText }}</a>
			</div>

			<!-- Heading -->
			<h2 v-else-if="b.type === 'heading'" class="blk-title">{{ b.text }}</h2>

			<!-- Markdown / HTML prose -->
			<div v-else-if="b.type === 'markdown'" class="blk-prose" v-html="md(b.value)"></div>
			<div v-else-if="b.type === 'html'" class="blk-prose" v-html="b.value"></div>

			<!-- Products -->
			<div v-else-if="b.type === 'products'">
				<h2 v-if="b.title" class="blk-title">{{ b.title }}</h2>
				<div v-if="(b.products || []).length === 0" style="color:var(--text-muted);">No products to show yet.</div>
				<div v-else class="sf-grid">
					<div v-for="p in b.products" :key="p.id" class="sf-card" @click="openProduct(p.handle)">
						<div class="sf-card-img">
							<img v-if="p.image" :src="p.image" :alt="p.title" loading="lazy" />
							<span v-else class="ph">No image</span>
						</div>
						<div class="sf-card-body">
							<span class="sf-card-title">{{ p.title }}</span>
							<span v-if="cardBadge(p)" class="badge" :class="cardBadge(p).cls">{{ cardBadge(p).label }}</span>
							<span class="sf-card-price">{{ priceRange(p) }}</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
</main>

<script type="module">
import { VDOM } from 'https://cdn.jsdelivr.net/npm/@mintjamsinc/ichigojs/dist/ichigo.esm.min.js';

const POLL_MS = 30000;
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// Minimal, dependency-free markdown → HTML for trusted CMS-authored prose.
// Supports headings, hr, images, links, bold/italic/code, ul/ol, paragraphs.
function miniMarkdown(src) {
	const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
	const out = [];
	let para = [], list = null; // list: {type:'ul'|'ol', items:[]}

	const inline = (t) => {
		let s = esc(t);
		s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
		s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
		s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
		s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
		s = s.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
		return s;
	};
	const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
	const flushList = () => { if (list) { out.push('<' + list.type + '>' + list.items.map((x) => '<li>' + inline(x) + '</li>').join('') + '</' + list.type + '>'); list = null; } };

	for (const raw of lines) {
		const line = raw.trimEnd();
		if (!line.trim()) { flushPara(); flushList(); continue; }
		let m;
		if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); continue; }
		if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); flushList(); out.push('<hr>'); continue; }
		if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushPara(); if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] }; } list.items.push(m[1]); continue; }
		if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { flushPara(); if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] }; } list.items.push(m[1]); continue; }
		flushList(); para.push(line.trim());
	}
	flushPara(); flushList();
	return out.join('\n');
}

const App = {
	data() {
		return {
			view: 'loading', errorMessage: '',
			store: {}, page: { blocks: [] }, liveItems: {},
			_pollTimer: null,
		};
	},
	computed: {
		lowStock() { return num(this.store.lowStock) ?? 5; },
		storefrontUrl() { return '../storefront/index.html'; },
	},
	methods: {
		async onMounted() {
			try {
				await this.loadStore();
				await this.loadPage();
				this.pollInventory();
				this._pollTimer = window.setInterval(() => this.pollInventory(), POLL_MS);
				this.view = 'content';
			} catch (e) {
				this.errorMessage = (e && e.message) ? e.message : 'Failed to load the page.';
				this.view = 'error';
			}
		},
		onUnmount() { if (this._pollTimer) clearInterval(this._pollTimer); },

		slug() {
			const p = new URLSearchParams(location.search).get('slug');
			if (p) return p;
			const h = (location.hash || '').replace(/^#\/?/, '');
			return h || 'welcome';
		},
		async fetchJson(rel) {
			const res = await fetch(rel, { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' });
			if (!res.ok) throw new Error('Request failed (' + res.status + ')');
			return res.json();
		},
		async loadStore() { try { this.store = await this.fetchJson('../catalog/store.json'); } catch (_) { this.store = {}; } },
		async loadPage() {
			const page = await this.fetchJson('./' + encodeURIComponent(this.slug()) + '.json');
			this.page = page || { blocks: [] };
			document.title = (this.page.title || 'Landing') + ' — ' + (this.store.name || 'Store');
		},
		async pollInventory() { try { const inv = await this.fetchJson('../catalog/inventory.json'); this.liveItems = (inv && inv.items) || {}; } catch (_) {} },

		md(v) { return miniMarkdown(v); },

		// Live availability badge for an embedded product card (#21).
		badgeFor(available) {
			if (available == null) return { cls: '', label: '' };
			if (available <= 0) return { cls: 'out', label: 'Sold out' };
			if (available <= this.lowStock) return { cls: 'low', label: 'Only ' + available + ' left' };
			return { cls: 'in', label: 'In stock' };
		},
		cardBadge(card) {
			const ids = card.inventoryItemIds || [];
			let tracked = false, total = 0;
			for (const id of ids) { if (Object.prototype.hasOwnProperty.call(this.liveItems, id)) { tracked = true; total += Number(this.liveItems[id]) || 0; } }
			const available = tracked ? total : (card.available != null ? Number(card.available) : null);
			const b = this.badgeFor(available);
			return b.cls ? b : null;
		},

		priceRange(card) {
			const lo = num(card.priceMin), hi = num(card.priceMax);
			const cur = this.store.currency || '';
			const fmt = (n) => { const s = Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 }); return cur ? s + ' ' + cur : s; };
			if (lo == null) return '';
			if (hi != null && hi !== lo) return fmt(lo) + ' – ' + fmt(hi);
			return fmt(lo);
		},

		openProduct(handle) { window.location.href = '../storefront/index.html#/product/' + encodeURIComponent(handle); },
		goStorefront(hash) { window.location.href = '../storefront/index.html' + (hash || '#/'); },
	},
};

VDOM.createApp(App).mount('#app');
</script>
</body>
</html>
